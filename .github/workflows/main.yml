name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Unzip project
      run: unzip -o ./*.zip -x ".github/*"
    - name: Add app icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="96dp" android:height="96dp"
            android:viewportWidth="96" android:viewportHeight="96">
            <path android:fillColor="#1976D2"
                android:pathData="M48,48m-48,0a48,48 0 1,1 96,0a48,48 0 1,1 -96,0"/>
            <path android:fillColor="#FFFFFF"
                android:pathData="M30,34h36v8h-36z M30,48h36v8h-36z M30,62h24v8h-24z"/>
        </vector>
        XML
        sed -i 's#@mipmap/ic_launcher_round#@drawable/ic_launcher#; s#@mipmap/ic_launcher#@drawable/ic_launcher#' app/src/main/AndroidManifest.xml
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'
    - run: gradle assembleDebug --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: Programahmed-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
