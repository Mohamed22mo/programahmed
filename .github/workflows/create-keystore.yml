name: Create Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
    - name: Generate keystore
      run: |
        P=$(openssl rand -hex 16)
        keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
          -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$P" -keypass "$P" -dname "CN=Expenses management"
        {
          echo "KEYSTORE_PASSWORD=$P"
          echo "KEY_PASSWORD=$P"
          echo "KEY_ALIAS=upload"
          echo "KEYSTORE_BASE64=$(base64 -w0 release.jks)"
        } > keystore-info.txt
    - uses: actions/upload-artifact@v4
      with:
        name: keystore
        path: |
          release.jks
          keystore-info.txt
        retention-days: 1
